[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dockfleet"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[project.scripts]
dockfleet = "dockfleet.cli.main:app"

[tool.setuptools]
packages = ["dockfleet"]

[tool.black]
line-length = 150

[tool.ruff]
line-length = 150
extend-ignore = ["F841", "E402"]
